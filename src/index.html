<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e0f11" />
    <meta
      name="description"
      content="PicGallery — archivo visual para organizar, presentar y compartir colecciones de imágenes."
    />
    <title>PicGallery — Archivo visual</title>
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <a class="skip-link" href="#gallery-main">Saltar al contenido</a>

    <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
      <symbol id="icon-grid" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="1" />
        <rect x="14" y="3" width="7" height="7" rx="1" />
        <rect x="3" y="14" width="7" height="7" rx="1" />
        <rect x="14" y="14" width="7" height="7" rx="1" />
      </symbol>
      <symbol id="icon-star" viewBox="0 0 24 24">
        <path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" />
      </symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.5" />
        <path d="M12 7.5V12l3 2" />
      </symbol>
      <symbol id="icon-folder" viewBox="0 0 24 24">
        <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.2l2 2h7.8A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z" />
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6.5" />
        <path d="M16 16l4.5 4.5" />
      </symbol>
      <symbol id="icon-chevron-left" viewBox="0 0 24 24">
        <path d="M15 5l-7 7 7 7" />
      </symbol>
      <symbol id="icon-chevron-right" viewBox="0 0 24 24">
        <path d="M9 5l7 7-7 7" />
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24">
        <path d="M6 6l12 12M18 6L6 18" />
      </symbol>
      <symbol id="icon-download" viewBox="0 0 24 24">
        <path d="M12 4v11m0 0l4-4m-4 4l-4-4" />
        <path d="M5 19.5h14" />
      </symbol>
      <symbol id="icon-heart" viewBox="0 0 24 24">
        <path d="M12 20s-7-4.4-7-9.3A4.2 4.2 0 0 1 12 7a4.2 4.2 0 0 1 7 3.7C19 15.6 12 20 12 20z" />
      </symbol>
      <symbol id="icon-move" viewBox="0 0 24 24">
        <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.2l2 2h7.8A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z" />
        <path d="M12 10.5v5m0 0l2.2-2.2M12 15.5l-2.2-2.2" />
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24">
        <path d="M5 12.5l4.5 4.5L19 7.5" />
      </symbol>
      <symbol id="icon-copy" viewBox="0 0 24 24">
        <rect x="8" y="8" width="12" height="12" rx="2" />
        <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
      </symbol>
      <symbol id="icon-image" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <circle cx="8.5" cy="9.5" r="1.5" />
        <path d="M4 17l5-5 4 4 3-3 4 4" />
      </symbol>
      <symbol id="icon-sliders" viewBox="0 0 24 24">
        <path d="M4 7h10M18 7h2M4 17h2M10 17h10" />
        <circle cx="16" cy="7" r="2" />
        <circle cx="8" cy="17" r="2" />
      </symbol>
      <symbol id="icon-menu" viewBox="0 0 24 24">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </symbol>
      <symbol id="icon-arrow-up-right" viewBox="0 0 24 24">
        <path d="M7 17L17 7M9 7h8v8" />
      </symbol>
      <symbol id="icon-layout" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <path d="M3 10h18M9 10v10" />
      </symbol>
      <symbol id="icon-info" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.5" />
        <path d="M12 11v5M12 7.8v.2" />
      </symbol>
      <symbol id="icon-sort" viewBox="0 0 24 24">
        <path d="M8 4v16m0 0l-3.5-3.5M8 20l3.5-3.5M16 20V4m0 0l-3.5 3.5M16 4l3.5 3.5" />
      </symbol>
      <symbol id="icon-palette" viewBox="0 0 24 24">
        <path d="M12 21a9 9 0 1 1 9-9c0 2.2-1.8 3.5-3.5 3.5H16a2 2 0 0 0-1.4 3.4A1.7 1.7 0 0 1 12 21z" />
        <circle cx="7.8" cy="11.5" r=".9" />
        <circle cx="10" cy="7.5" r=".9" />
        <circle cx="15" cy="7.5" r=".9" />
        <circle cx="17.5" cy="11" r=".9" />
      </symbol>
    </svg>

    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" aria-label="Navegación principal"></aside>

      <div class="workspace">
        <header class="topbar" id="topbar"></header>
        <main class="main" id="gallery-main" tabindex="-1">
          <div class="toolbar" id="toolbar"></div>
          <div id="gallery-region"></div>
        </main>
      </div>

      <aside class="inspector" id="inspector" aria-label="Ficha técnica de la imagen"></aside>
    </div>

    <div class="scrim" id="scrim" hidden></div>
    <div class="bulk-slot" id="bulk-bar"></div>
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="false"></div>

    <div class="drop-overlay" id="drop-overlay" hidden>
      <div class="drop-overlay__panel">
        <svg class="icon" aria-hidden="true"><use href="#icon-image"></use></svg>
        <strong>Suelta las imágenes para añadirlas</strong>
        <span>JPG, PNG o WEBP · hasta 25 MB por archivo</span>
      </div>
    </div>

    <dialog class="lightbox" id="lightbox" aria-label="Visor de imágenes"></dialog>
    <dialog class="dialog" id="upload-dialog" aria-labelledby="upload-title"></dialog>
    <dialog class="dialog" id="move-dialog" aria-labelledby="move-title"></dialog>
    <dialog class="dialog dialog--wide" id="export-dialog" aria-labelledby="export-title"></dialog>

    <section class="print-sheet" id="print-sheet" aria-hidden="true"></section>

    <script type="module" src="./main.js"></script>
  </body>
</html>
